---
title: "MATLAB on OSCAR"
cluster: "slurmctld"
attributes:
  modules:
    value: ""
    help: "You can leave this blank if you are **not** loading additional modules. Otherwise load multiple modules by module names seperated by spaces. For example to load multiple  modules use: `R/3.5.1 gdal/3.11.0` "
  num_cores:
    widget: "number_field"
    label: "Number of cores"
    value: 1
    help: |
      Maximum of 32 tasks is allowed 
    min: 1
    max: 32
    step: 1
  bc_num_hours:
    value: 1
    min: 1
    step: 1
    help: "Specify the Wall time in hours"
  bc_vnc_resolution:
    required: true
  version:
    widget: select
    label: "MATLAB version"
    help: "This defines the version of MATLAB you want to load."
    options:
      - [ "R2025a", "matlab/R2025a" ]
  bc_account:
    label: "Condo Account"
    value: ""
  bc_queue:
    label: "Partition"
    value: ""
  memtask:
    widget: "text_field"
    value: "default"
    label: "Memory per job"
    help: |
      - **default** - Use default, 4 GB per task.
      - **512M** - Use 512 MB.
      - **128G** - Use 128 GB.
  reservation:
    widget: "text_field"
    value: ""
    label: "Reservation"
    help: "Enter the reservation name here. Leave it blank if you are not using a reservation for submitting jobs."
  features:
    widget: "text_field"
    value: ""
    label: "Slurm Features"
    help: "This field is optional. Enter any required Slurm feature here. To see an exhaustive list of Slurm features, please click <a href=\"https://docs.ccv.brown.edu/oscar/system-overview#hardware-details\">here</a>."
      #x_module: "intltool/0.51.0 libwnck/3.24.1 xfce/4.16"
form:
  - version
  - num_cores
  - bc_num_hours
  - memtask
  - modules
  - bc_account
  - bc_queue
  - reservation
  - features
  - bc_email_on_started
